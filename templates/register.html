{% extends "base.html" %}

{% block title %}Register - Notification Manager{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="card-header text-center">
            <h4 class="mb-0">
                <i class="bi bi-person-plus"></i> Create Account
            </h4>
        </div>
        <div class="card-body p-4">
            <form id="register-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required minlength="3">
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name (Optional)</label>
                    <input type="text" class="form-control" id="full_name">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required minlength="6">
                </div>
                
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" required>
                </div>
                
                <div id="error-message"></div>
                
                <button type="submit" class="btn btn-gradient-primary w-100">
                    <i class="bi bi-person-plus"></i> Register
                </button>
            </form>
            
            <hr>
            
            <p class="text-center text-muted mb-0">
                Already have an account? <a href="/login">Login here</a>
            </p>
        </div>
    </div>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const full_name = document.getElementById('full_name').value;
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const errorDiv = document.getElementById('error-message');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    
    // Validate passwords match
    if (password !== confirm_password) {
        errorDiv.innerHTML = `<div class="alert alert-danger">Passwords do not match</div>`;
        return;
    }
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';
    
    try {
        const response = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password, full_name })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            auth.setTokens(data.access_token, data.refresh_token, data.user);
            window.location.href = '/dashboard';
        } else {
            errorDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-person-plus"></i> Register';
        }
    } catch (error) {
        errorDiv.innerHTML = `<div class="alert alert-danger">Registration failed. Please try again.</div>`;
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-person-plus"></i> Register';
    }
});
</script>
{% endblock %}
