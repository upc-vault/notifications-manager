[project]
name = "notifications-manager"
version = "0.1.0"
description = "Notifications manager"
authors = [
    {name = "fixedbyte",email = "wilmerquispecode@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "oracledb (>=3.4.2,<4.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "firebase-admin (>=6.5.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "notifications-manager"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
