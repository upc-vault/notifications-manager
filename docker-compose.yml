version: '3.8'

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: nm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - notification-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # RabbitMQ for message queuing
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nm-rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - notification-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Notifications API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nm-api
    ports:
      - "5000:5000"
    environment:
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=5000
      - DATABASE_URL=sqlite:////app/data/notifications.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - BANDIT_STRATEGY=epsilon_greedy
      - BANDIT_EPSILON=0.1
      - BANDIT_MODEL_PATH=/app/models/bandit_model.pkl
    volumes:
      - ./notifications-manager:/app/notifications-manager
      - api_data:/app/data
      - models_data:/app/models
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped
    command: python -m notifications-manager.nm

  # Notification Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nm-worker
    command: python -m notifications-manager.worker
    environment:
      - DATABASE_URL=sqlite:////app/data/notifications.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
    volumes:
      - ./notifications-manager:/app/notifications-manager
      - api_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped

  # Feedback Worker
  feedback-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nm-feedback-worker
    command: python -m notifications-manager.feedback_worker
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - BANDIT_STRATEGY=epsilon_greedy
      - BANDIT_EPSILON=0.1
      - BANDIT_MODEL_PATH=/app/models/bandit_model.pkl
    volumes:
      - ./notifications-manager:/app/notifications-manager
      - models_data:/app/models
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped

networks:
  notification-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  api_data:
  models_data:
