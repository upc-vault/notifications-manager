<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Omega</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .navbar-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .navbar-links a {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .navbar-links a:hover {
            background-color: rgba(102, 126, 234, 0.1);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-badge {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-admin {
            background: #ffd700;
            color: #856404;
        }
        .badge-user {
            background: #d1ecf1;
            color: #0c5460;
        }
        .badge-active {
            background: #d4edda;
            color: #155724;
        }
        .badge-inactive {
            background: #f8d7da;
            color: #721c24;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 5px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Ω Omega</div>
        <div class="navbar-links">
            <a href="/">Dashboard</a>
            <a href="/test-email">Email</a>
            <a href="/test-sms">SMS</a>
            <a href="/test/webpush">WebPush</a>
            <a href="/test/push">Push</a>
            <a href="/test-whatsapp">WhatsApp</a>
            <a href="/intelligence">AI Demo</a>
            <span id="admin-links" style="display: none;">
                <a href="/templates">Templates</a>
                <a href="/logs">Logs</a>
                <a href="/users">Users</a>
            </span>
            <div class="user-info">
                <span class="user-badge" id="user-role">Admin</span>
                <span id="username">Loading...</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1>👥 User Management</h1>
            <p class="subtitle">Manage user accounts and permissions</p>

            <div id="alert" class="alert"></div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="total-users">-</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="admin-count">-</div>
                    <div class="stat-label">Administrators</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="user-count">-</div>
                    <div class="stat-label">Regular Users</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="active-count">-</div>
                    <div class="stat-label">Active Users</div>
                </div>
            </div>

            <div id="loading" class="loading">Loading users...</div>

            <table id="users-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Last Login</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUserRole = localStorage.getItem('userRole');
        let currentUsername = localStorage.getItem('username');

        // Check authentication and role
        async function checkAuth() {
            try {
                const response = await fetch('/api/v1/auth/check');
                const data = await response.json();
                
                if (!data.authenticated) {
                    window.location.href = '/login';
                    return false;
                }
                
                currentUsername = data.username;
                currentUserRole = data.role;
                
                document.getElementById('username').textContent = data.username;
                document.getElementById('user-role').textContent = data.role.toUpperCase();
                
                if (data.role === 'admin') {
                    document.getElementById('admin-links').style.display = 'flex';
                } else {
                    // Non-admins shouldn't be here
                    showAlert('Access denied. Admin role required.', 'error');
                    setTimeout(() => window.location.href = '/admin', 2000);
                    return false;
                }
                
                return true;
            } catch (error) {
                window.location.href = '/login';
                return false;
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/v1/auth/users');
                const data = await response.json();
                
                if (data.success) {
                    displayUsers(data.users);
                    updateStats(data.users);
                } else {
                    showAlert(data.error || 'Failed to load users', 'error');
                }
            } catch (error) {
                showAlert('Failed to load users', 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('users-table').style.display = 'table';
            }
        }

        function displayUsers(users) {
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = '';
            
            users.forEach(user => {
                const row = document.createElement('tr');
                
                const roleClass = user.role === 'admin' ? 'badge-admin' : 'badge-user';
                const statusClass = user.is_active ? 'badge-active' : 'badge-inactive';
                const statusText = user.is_active ? 'Active' : 'Inactive';
                
                const created = new Date(user.created_at).toLocaleDateString();
                const lastLogin = user.last_login ? new Date(user.last_login).toLocaleString() : 'Never';
                
                const isCurrentUser = user.username === currentUsername;
                const isAdminUser = user.username === 'admin';
                
                row.innerHTML = `
                    <td><strong>${user.username}</strong></td>
                    <td>${user.email || '-'}</td>
                    <td><span class="badge ${roleClass}">${user.role.toUpperCase()}</span></td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td>${created}</td>
                    <td>${lastLogin}</td>
                    <td>
                        ${!isAdminUser && !isCurrentUser ? `
                            <button class="btn btn-primary" onclick="changeRole('${user.username}', '${user.role === 'admin' ? 'user' : 'admin'}')">
                                ${user.role === 'admin' ? 'Demote' : 'Promote'}
                            </button>
                            <button class="btn btn-warning" onclick="toggleUser('${user.username}')">
                                ${user.is_active ? 'Deactivate' : 'Activate'}
                            </button>
                            <button class="btn btn-danger" onclick="deleteUser('${user.username}')">Delete</button>
                        ` : '<em>Protected</em>'}
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        function updateStats(users) {
            document.getElementById('total-users').textContent = users.length;
            document.getElementById('admin-count').textContent = users.filter(u => u.role === 'admin').length;
            document.getElementById('user-count').textContent = users.filter(u => u.role === 'user').length;
            document.getElementById('active-count').textContent = users.filter(u => u.is_active).length;
        }

        async function changeRole(username, newRole) {
            if (!confirm(`Change ${username}'s role to ${newRole}?`)) return;
            
            try {
                const response = await fetch(`/api/v1/auth/users/${username}/role`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: newRole })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert(data.message, 'success');
                    loadUsers();
                } else {
                    showAlert(data.error, 'error');
                }
            } catch (error) {
                showAlert('Failed to change role', 'error');
            }
        }

        async function toggleUser(username) {
            try {
                const response = await fetch(`/api/v1/auth/users/${username}/toggle`, {
                    method: 'PUT'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert(data.message, 'success');
                    loadUsers();
                } else {
                    showAlert(data.error, 'error');
                }
            } catch (error) {
                showAlert('Failed to toggle user status', 'error');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Delete user ${username}? This cannot be undone.`)) return;
            
            try {
                const response = await fetch(`/api/v1/auth/users/${username}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert(data.message, 'success');
                    loadUsers();
                } else {
                    showAlert(data.error, 'error');
                }
            } catch (error) {
                showAlert('Failed to delete user', 'error');
            }
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        async function logout() {
            await fetch('/api/v1/auth/logout', { method: 'POST' });
            localStorage.clear();
            window.location.href = '/login';
        }

        // Initialize
        checkAuth().then(authorized => {
            if (authorized) {
                loadUsers();
            }
        });
    </script>
</body>
</html>
