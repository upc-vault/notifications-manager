<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPush Testing - Omega</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/navbar.css">
    <link rel="stylesheet" href="/static/css/page-header.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .test-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #28a745;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #218838;
        }

        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .status-box.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-box.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-box.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .template-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .template-option {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .template-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .template-option.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .template-option h4 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .template-option p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/admin" style="text-decoration: none;"><div class="logo">Ω Omega</div></a>
            <ul class="nav-links">
                <li><a href="/admin">Admin Home</a></li>
                <li class="dropdown">
                    <a href="#" class="dropdown-toggle">Test ▼</a>
                    <ul class="dropdown-menu">
                        <li><a href="/test/webpush">WebPush</a></li>
                        <li><a href="/test/email">Email</a></li>
                        <li><a href="/test/sms">SMS</a></li>
                        <li><a href="/test/push">Push</a></li>
                    </ul>
                </li>
                <li><a href="/dashboard">Dashboard</a></li>
                <li><a href="/templates">Templates</a></li>
                <li><a href="/logs">Logs</a></li>
                <li><a href="/intelligence">AI Demo</a></li>
                <li class="user-section">
                    <div class="user-avatar" id="user-avatar">A</div>
                    <span class="user-name" id="user-name">Admin</span>
                </li>
                <li><a href="#" id="logout-link" style="color: #dc3545;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="page-header gradient-bg">
            <h1>🌐 WebPush Testing Center</h1>
            <p>Test browser push notifications in real-time</p>
        </div>

        <div class="test-card">
            <div id="webpush-status" class="status-box info">
                Checking browser support...
            </div>

            <div id="webpush-form" style="display: none;">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="webpush-userid" placeholder="Enter user ID" value="user123">
                </div>

                <div class="form-group">
                    <label>Notification Title</label>
                    <input type="text" id="webpush-title" placeholder="Enter notification title" value="New Message">
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea id="webpush-message" placeholder="Enter notification message">You have a new message from Omega!</textarea>
                </div>

                <button class="btn" id="subscribe-btn">Subscribe to Notifications</button>
                <button class="btn btn-secondary" id="send-test-btn" style="display: none;">Send Test Notification</button>

                <div id="template-section" class="template-section" style="display: none;">
                    <h3 style="margin-bottom: 15px; color: #667eea;">Or Use Template</h3>
                    <div id="template-list"></div>
                    <button class="btn btn-secondary" id="send-template-btn" disabled>Send with Selected Template</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/template-integration.js"></script>
    <script>
        // Check authentication and load user info
        async function checkAuth() {
            try {
                const response = await fetch('/api/v1/auth/check');
                const data = await response.json();
                if (data.authenticated) {
                    const username = data.username || 'Admin';
                    document.getElementById('user-name').textContent = username;
                    document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
                }
            } catch (error) {
                console.error('Auth check failed:', error);
            }
        }
        checkAuth();

        // Logout functionality
        document.getElementById('logout-link').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await fetch('/api/v1/auth/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout failed:', error);
                window.location.href = '/';
            }
        });

        // WebPush functionality
        let subscriptionData = null;
        let selectedTemplate = null;

        // Helper function to convert VAPID key from base64 to Uint8Array
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/\-/g, '+')
                .replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function checkBrowserSupport() {
            const statusDiv = document.getElementById('webpush-status');
            const formDiv = document.getElementById('webpush-form');

            if (!('serviceWorker' in navigator)) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = '❌ Service Worker not supported in this browser';
                return false;
            }

            if (!('PushManager' in window)) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = '❌ Push notifications not supported in this browser';
                return false;
            }

            statusDiv.className = 'status-box success';
            statusDiv.textContent = '✅ Browser supports Web Push notifications';
            formDiv.style.display = 'block';
            
            await loadTemplates();
            
            return true;
        }

        async function loadTemplates() {
            try {
                const response = await fetch('/api/v1/templates');
                const data = await response.json();
                
                if (data.success && data.templates.length > 0) {
                    const templateList = document.getElementById('template-list');
                    templateList.innerHTML = data.templates.map(template => `
                        <div class="template-option" data-template-id="${template.id}">
                            <h4>${template.name}</h4>
                            <p>${template.message}</p>
                        </div>
                    `).join('');
                    
                    document.querySelectorAll('.template-option').forEach(option => {
                        option.addEventListener('click', () => {
                            document.querySelectorAll('.template-option').forEach(opt => 
                                opt.classList.remove('selected'));
                            option.classList.add('selected');
                            selectedTemplate = option.dataset.templateId;
                            document.getElementById('send-template-btn').disabled = false;
                        });
                    });
                    
                    document.getElementById('template-section').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading templates:', error);
            }
        }

        async function subscribeUser() {
            const statusDiv = document.getElementById('webpush-status');
            const subscribeBtn = document.getElementById('subscribe-btn');
            const sendBtn = document.getElementById('send-test-btn');

            try {
                statusDiv.className = 'status-box info';
                statusDiv.textContent = 'Registering service worker...';

                const registration = await navigator.serviceWorker.register('/sw.js');
                await navigator.serviceWorker.ready;

                statusDiv.textContent = 'Requesting notification permission...';
                const permission = await Notification.requestPermission();

                if (permission !== 'granted') {
                    statusDiv.className = 'status-box error';
                    statusDiv.textContent = '❌ Notification permission denied';
                    return;
                }

                statusDiv.textContent = 'Getting VAPID public key...';
                const vapidResponse = await fetch('/api/v1/webpush/vapid-public-key');
                const vapidData = await vapidResponse.json();

                if (!vapidData.public_key) {
                    throw new Error('VAPID public key not found');
                }

                statusDiv.textContent = 'Subscribing to push service...';
                const applicationServerKey = urlBase64ToUint8Array(vapidData.public_key);
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: applicationServerKey
                });

                statusDiv.textContent = 'Registering subscription with server...';
                const userId = document.getElementById('webpush-userid').value;
                const response = await fetch('/api/v1/webpush/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        subscription: subscription.toJSON()
                    })
                });

                const data = await response.json();

                if (data.success) {
                    subscriptionData = subscription.toJSON();
                    statusDiv.className = 'status-box success';
                    statusDiv.textContent = '✅ Successfully subscribed! You can now send test notifications.';
                    subscribeBtn.style.display = 'none';
                    sendBtn.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Subscription failed');
                }
            } catch (error) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = `❌ Error: ${error.message}`;
                console.error('Subscription error:', error);
            }
        }

        async function sendTestNotification() {
            const statusDiv = document.getElementById('webpush-status');
            const sendBtn = document.getElementById('send-test-btn');

            try {
                sendBtn.disabled = true;
                statusDiv.className = 'status-box info';
                statusDiv.textContent = 'Sending test notification...';

                const userId = document.getElementById('webpush-userid').value;
                const title = document.getElementById('webpush-title').value;
                const message = document.getElementById('webpush-message').value;

                const response = await fetch('/api/v1/webpush/send-test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        title: title,
                        message: message
                    })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.className = 'status-box success';
                    statusDiv.textContent = `✅ ${data.message}`;
                } else {
                    throw new Error(data.error || 'Send failed');
                }
            } catch (error) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = `❌ Error: ${error.message}`;
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function sendWithTemplate() {
            if (!selectedTemplate) return;

            const statusDiv = document.getElementById('webpush-status');
            const sendBtn = document.getElementById('send-template-btn');

            try {
                sendBtn.disabled = true;
                statusDiv.className = 'status-box info';
                statusDiv.textContent = 'Sending notification with template...';

                const userId = document.getElementById('webpush-userid').value;

                const response = await fetch('/api/v1/webpush/send-with-template', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        template_id: parseInt(selectedTemplate)
                    })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.className = 'status-box success';
                    statusDiv.textContent = `✅ Notification sent successfully!`;
                } else {
                    throw new Error(data.error || 'Send failed');
                }
            } catch (error) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = `❌ Error: ${error.message}`;
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkBrowserSupport();

            document.getElementById('subscribe-btn').addEventListener('click', subscribeUser);
            document.getElementById('send-test-btn').addEventListener('click', sendTestNotification);
            document.getElementById('send-template-btn').addEventListener('click', sendWithTemplate);
        });
    </script>
</body>
</html>
